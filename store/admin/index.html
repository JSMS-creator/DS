<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Dropship Store</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f8f8; color: #111; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #111; color: #fff; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; }
    .sidebar h1 { font-size: 1rem; font-weight: 800; margin-bottom: 20px; color: #fff; padding: 0 8px; }
    .nav-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: background 0.15s; }
    .nav-item:hover { background: rgba(255,255,255,0.1); }
    .nav-item.active { background: rgba(255,255,255,0.15); font-weight: 600; }
    .main { margin-left: 220px; padding: 32px; }
    .page { display: none; } .page.active { display: block; }
    h2 { font-size: 1.4rem; margin-bottom: 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .label { font-size: 0.8rem; color: #666; margin-bottom: 8px; }
    .stat-card .value { font-size: 1.6rem; font-weight: 800; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    th { padding: 12px 16px; text-align: left; font-size: 0.8rem; color: #666; border-bottom: 1px solid #eee; background: #fafafa; }
    td { padding: 12px 16px; font-size: 0.85rem; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 3px 8px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-processing { background: #dbeafe; color: #1e40af; }
    .badge-shipped { background: #d1fae5; color: #065f46; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }
    .section-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
    input, textarea, select { width: 100%; padding: 10px 12px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 0.9rem; margin-bottom: 12px; outline: none; }
    input:focus, textarea:focus { border-color: #2563eb; }
    button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-primary { background: #111; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #111; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .search-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .search-row input { margin: 0; }
    /* Category chips */
    .category-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chip { padding: 6px 14px; border-radius: 100px; border: 1.5px solid #e0e0e0; background: #fff; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .chip:hover { border-color: #111; }
    .chip.active { background: #111; color: #fff; border-color: #111; }
    #cj-results { margin-top: 16px; }
    .cj-product { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .cj-product-info { font-size: 0.85rem; flex: 1; min-width: 0; }
    .cj-product-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); width: 360px; }
    .login-box h1 { margin-bottom: 24px; }
    #app { display: none; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; padding: 32px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 20px; font-size: 1.4rem; cursor: pointer; color: #666; background: none; border: none; padding: 4px 8px; }
    .img-gallery { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 4px; }
    .img-gallery img { height: 120px; width: 120px; object-fit: cover; border-radius: 8px; flex-shrink: 0; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s; }
    .img-gallery img.selected { border-color: #2563eb; }
    .img-main { width: 100%; height: 280px; object-fit: contain; border-radius: 12px; background: #f8f8f8; margin-bottom: 12px; }
    .variants-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 16px; }
    .variants-table th { text-align: left; padding: 8px 10px; background: #f8f8f8; font-size: 0.75rem; color: #666; }
    .variants-table td { padding: 8px 10px; border-top: 1px solid #f0f0f0; }
    .detail-meta { display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
    .detail-meta div { font-size: 0.85rem; }
    .detail-meta .meta-label { font-size: 0.75rem; color: #666; margin-bottom: 2px; }
    .detail-meta .meta-val { font-weight: 700; font-size: 1rem; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <h1>Admin-login</h1>
    <input type="password" id="secret-input" placeholder="Admin-nøkkel" />
    <button class="btn-primary" onclick="login()" style="width:100%">Logg inn</button>
    <p id="login-error" style="color:red;font-size:0.85rem;margin-top:8px"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <h1>📦 Admin</h1>
    <div class="nav-item active" onclick="showPage('dashboard', event)">📊 Dashboard</div>
    <div class="nav-item" onclick="showPage('orders', event)">🛒 Ordrer</div>
    <div class="nav-item" onclick="showPage('products', event)">🏷️ Produkter</div>
    <div class="nav-item" onclick="showPage('cj', event)">🔍 Søk CJ</div>
  </div>

  <div class="main">
    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <h2>Dashboard</h2>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Totale ordrer</div><div class="value" id="stat-orders">—</div></div>
        <div class="stat-card"><div class="label">Total omsetning</div><div class="value" id="stat-revenue">—</div></div>
        <div class="stat-card"><div class="label">Ventende</div><div class="value" id="stat-pending">—</div></div>
        <div class="stat-card"><div class="label">Under behandling</div><div class="value" id="stat-processing">—</div></div>
      </div>
      <div class="section-card">
        <h3 style="margin-bottom:16px">Siste ordrer</h3>
        <div id="recent-orders-table"></div>
      </div>
    </div>

    <!-- ORDERS -->
    <div class="page" id="page-orders">
      <h2>Alle ordrer</h2>
      <div id="orders-table"></div>
    </div>

    <!-- PRODUCTS -->
    <div class="page" id="page-products">
      <h2>Produkter i butikken</h2>
      <div class="section-card">
        <h3>Legg til / oppdater produkt manuelt</h3>
        <input id="p-cj-id" placeholder="CJ Product ID *" />
        <input id="p-name" placeholder="Produktnavn *" />
        <textarea id="p-desc" rows="4" placeholder="Beskrivelse (HTML ok)"></textarea>
        <input id="p-buy" placeholder="CJ Kjøpspris (USD)" type="number" step="0.01" />
        <input id="p-sell" placeholder="Salgspris NOK (ekskl. MVA) *" type="number" step="1" />
        <input id="p-shipping" placeholder="Frakt NOK (0 = gratis)" type="number" step="1" />
        <input id="p-images" placeholder="Bilde-URLer, kommaseparert" />
        <button class="btn-primary" onclick="saveProduct()">Lagre produkt</button>
        <span id="p-save-msg" style="margin-left:12px;font-size:0.85rem;color:green"></span>
      </div>
      <div id="products-list"></div>
    </div>

    <!-- CJ SEARCH -->
    <div class="page" id="page-cj">
      <h2>Søk CJ Dropshipping</h2>
      <div class="search-row">
        <input id="cj-search-input" placeholder="Søk på produktnavn..." onkeydown="if(event.key==='Enter')searchCJ()" />
        <button class="btn-primary" onclick="searchCJ()">Søk</button>
      </div>
      <div class="category-chips" id="category-chips">
        <span class="chip" style="color:#999;border-style:dashed">Laster kategorier...</span>
      </div>
      <div id="cj-results"></div>
    </div>
  </div>
</div>

<!-- PRODUCT DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="detail-modal-inner">
    <button class="modal-close" onclick="closeDetailModal()">✕</button>
    <div id="detail-modal-content"><p>Laster...</p></div>
  </div>
</div>

<script>
const API = 'https://thorough-charm-production-ecb9.up.railway.app/api';
let adminSecret = '';
let activeCategoryId = '';
let activeCategoryName = '';

async function api(path, options = {}) {
  const res = await fetch(API + path, { ...options, headers: { 'x-admin-secret': adminSecret, 'Content-Type': 'application/json', ...options.headers } });
  return res.json();
}

async function login() {
  adminSecret = document.getElementById('secret-input').value;
  const data = await api('/admin/stats').catch(() => null);
  if (!data || data.error) { document.getElementById('login-error').textContent = 'Feil nøkkel.'; return; }
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadDashboard();
  loadCategories();
}

function showPage(name, ev) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (ev && ev.currentTarget) ev.currentTarget.classList.add('active');
  if (name === 'dashboard') loadDashboard();
  if (name === 'orders') loadOrders();
  if (name === 'products') loadProducts();
}

async function loadDashboard() {
  const stats = await api('/admin/stats');
  document.getElementById('stat-orders').textContent = stats.totalOrders;
  document.getElementById('stat-revenue').textContent = 'NOK ' + Math.round(stats.totalRevenue).toLocaleString('no-NO');
  document.getElementById('stat-pending').textContent = stats.pending;
  document.getElementById('stat-processing').textContent = stats.processing;
  const orders = await api('/admin/orders');
  document.getElementById('recent-orders-table').innerHTML = renderOrderTable(orders.slice(0, 5));
}

async function loadOrders() {
  const orders = await api('/admin/orders');
  document.getElementById('orders-table').innerHTML = renderOrderTable(orders);
}

function renderOrderTable(orders) {
  if (!orders.length) return '<p style="color:#666">Ingen ordrer ennå.</p>';
  return `<table>
    <thead><tr><th>ID</th><th>Kunde</th><th>Produkt</th><th>Total</th><th>Status</th><th>Dato</th><th>Sporing</th></tr></thead>
    <tbody>${orders.map(o => `
      <tr>
        <td>#${o.id}</td>
        <td>${o.customer_name}<br><small style="color:#999">${o.customer_email}</small></td>
        <td>${o.product_name} × ${o.quantity}</td>
        <td>NOK ${Math.round(o.total_nok).toLocaleString('no-NO')}</td>
        <td><span class="badge badge-${o.status}">${o.status}</span></td>
        <td>${o.created_at?.slice(0,10)}</td>
        <td>${o.tracking_number ? `<a href="${o.tracking_url || '#'}" target="_blank">${o.tracking_number}</a>` : '—'}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

async function loadProducts() {
  const products = await api('/admin/../products');
  document.getElementById('products-list').innerHTML = products.length
    ? products.map(p => `<div class="section-card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
        <div><b>${p.name}</b><br><small style="color:#666">CJ ID: ${p.cj_product_id} · NOK ${p.sell_price_nok}</small></div>
        <button class="btn-secondary" onclick="toggleProduct('${p.cj_product_id}')">${p.active ? 'Deaktiver' : 'Aktiver'}</button>
      </div>`).join('')
    : '<p style="color:#666">Ingen produkter ennå. Legg til via skjemaet over.</p>';
}

async function saveProduct() {
  const data = {
    cj_product_id: document.getElementById('p-cj-id').value.trim(),
    name: document.getElementById('p-name').value.trim(),
    description: document.getElementById('p-desc').value.trim(),
    buy_price_usd: parseFloat(document.getElementById('p-buy').value) || null,
    sell_price_nok: parseFloat(document.getElementById('p-sell').value),
    shipping_price_nok: parseFloat(document.getElementById('p-shipping').value) || 0,
    images: document.getElementById('p-images').value.split(',').map(s => s.trim()).filter(Boolean),
    variants: []
  };
  if (!data.cj_product_id || !data.name || !data.sell_price_nok) { alert('Fyll inn CJ ID, navn og salgspris.'); return; }
  await api('/admin/products', { method: 'POST', body: JSON.stringify(data) });
  document.getElementById('p-save-msg').textContent = '✓ Lagret!';
  setTimeout(() => document.getElementById('p-save-msg').textContent = '', 3000);
  loadProducts();
}

async function toggleProduct(id) {
  await api(`/admin/products/${id}/toggle`, { method: 'PATCH' });
  loadProducts();
}

// ── CATEGORIES ──────────────────────────────────────────────

const POPULAR_CATEGORY_NAMES = [
  'Pet Supplies', 'Home & Garden', 'Sports & Outdoors', 'Electronics',
  'Clothing', 'Beauty & Health', 'Toys & Games', 'Automotive', 'Kitchen', 'Baby'
];

async function loadCategories() {
  try {
    const result = await api('/admin/cj/categories');
    const list = result?.data || [];
    renderCategoryChips(list);
  } catch {
    document.getElementById('category-chips').innerHTML = '';
  }
}

function renderCategoryChips(categories) {
  const container = document.getElementById('category-chips');
  // Try to pick popular ones first, then fill up to 12 total
  const sorted = [...categories].sort((a, b) => {
    const aPop = POPULAR_CATEGORY_NAMES.some(n => (a.categoryName || '').toLowerCase().includes(n.toLowerCase()));
    const bPop = POPULAR_CATEGORY_NAMES.some(n => (b.categoryName || '').toLowerCase().includes(n.toLowerCase()));
    return bPop - aPop;
  });
  const shown = sorted.slice(0, 12);
  container.innerHTML = shown.map(c => `
    <span class="chip" data-id="${c.categoryId}" data-name="${c.categoryName}" onclick="filterCategory(this)">
      ${c.categoryName}
    </span>
  `).join('');
}

function filterCategory(el) {
  const id = el.dataset.id;
  if (activeCategoryId === id) {
    // deselect
    activeCategoryId = '';
    activeCategoryName = '';
    el.classList.remove('active');
  } else {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    activeCategoryId = id;
    activeCategoryName = el.dataset.name;
    document.getElementById('cj-search-input').value = '';
  }
  searchCJ();
}

// ── CJ SEARCH ────────────────────────────────────────────────

async function searchCJ() {
  const q = document.getElementById('cj-search-input').value.trim();
  if (!q && !activeCategoryId) return;
  document.getElementById('cj-results').innerHTML = '<p>Søker...</p>';
  let url = '/admin/cj/search?';
  if (q) url += `q=${encodeURIComponent(q)}`;
  if (activeCategoryId) url += `${q ? '&' : ''}categoryId=${encodeURIComponent(activeCategoryId)}`;
  const data = await api(url);
  const products = data?.data?.list || data?.data || data?.list || [];
  document.getElementById('cj-results').innerHTML = products.length
    ? products.map(p => {
        const img = p.productImage || (p.productImageSet && p.productImageSet[0]) || '';
        const price = p.sellPrice || p.salePrice || '?';
        const name = p.productNameEn || p.productName || 'Ukjent produkt';
        const safeName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `<div class="cj-product">
          ${img ? `<img src="${img}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0" onerror="this.style.display='none'" />` : '<div style="width:72px;height:72px;background:#f0f0f0;border-radius:8px;flex-shrink:0"></div>'}
          <div class="cj-product-info">
            <b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</b>
            <span style="color:#666;font-size:0.8rem">ID: ${p.pid} · USD ${price}</span>
          </div>
          <div class="cj-product-actions">
            <button class="btn-secondary btn-sm" onclick="openDetailModal('${p.pid}')">Detaljer</button>
            <button class="btn-primary btn-sm" onclick="prefillProduct('${p.pid}','${safeName}','${price}','')">Importer</button>
          </div>
        </div>`;
      }).join('')
    : '<p style="color:#666">Ingen resultater.</p>';
}

// ── PRODUCT DETAIL MODAL ──────────────────────────────────────

async function openDetailModal(pid) {
  document.getElementById('detail-modal').style.display = 'flex';
  document.getElementById('detail-modal-content').innerHTML = '<p style="text-align:center;padding:40px">Laster produktdetaljer...</p>';
  try {
    const data = await api(`/admin/cj/product/${pid}`);
    const p = data.product || {};
    const variants = data.variants || [];
    const images = [p.productImage, ...(p.productImageSet || [])].filter(Boolean);
    const uniqueImages = [...new Set(images)];
    const price = p.sellPrice || p.salePrice || '?';
    const name = p.productNameEn || p.productName || 'Ukjent produkt';
    const safeName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    const safeImages = uniqueImages.join(',').replace(/'/g, "\\'");

    document.getElementById('detail-modal-content').innerHTML = `
      ${uniqueImages.length ? `<img class="img-main" id="main-img" src="${uniqueImages[0]}" />` : ''}
      ${uniqueImages.length > 1 ? `<div class="img-gallery">${uniqueImages.map((u, i) =>
        `<img src="${u}" class="${i===0?'selected':''}" onclick="selectImg(this,'${u}')" onerror="this.style.display='none'" />`
      ).join('')}</div>` : ''}

      <h3 style="margin-bottom:12px">${name}</h3>
      <div class="detail-meta">
        <div><div class="meta-label">CJ Pris (USD)</div><div class="meta-val">$${price}</div></div>
        <div><div class="meta-label">Foreslått NOK</div><div class="meta-val">NOK ${Math.round(parseFloat(price)||0 * 10.5 * 1.25)}</div></div>
        ${p.deliveryTime ? `<div><div class="meta-label">Leveringstid</div><div class="meta-val">${p.deliveryTime} dager</div></div>` : ''}
        ${p.weight ? `<div><div class="meta-label">Vekt</div><div class="meta-val">${p.weight}g</div></div>` : ''}
      </div>

      ${variants.length ? `
        <h4 style="margin-bottom:8px">Varianter (${variants.length})</h4>
        <table class="variants-table">
          <thead><tr><th>Variant</th><th>SKU</th><th>Pris (USD)</th><th>Lager</th></tr></thead>
          <tbody>${variants.map(v => `
            <tr>
              <td>${v.variantNameEn || v.variantName || '—'}</td>
              <td style="font-size:0.75rem;color:#999">${v.variantSku || '—'}</td>
              <td>$${v.variantSellPrice || v.sellPrice || '?'}</td>
              <td>${v.variantStock != null ? v.variantStock : '—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>` : ''}

      ${p.description ? `<details style="margin-bottom:16px"><summary style="cursor:pointer;font-weight:600;margin-bottom:8px">Produktbeskrivelse</summary><div style="font-size:0.85rem;color:#444;line-height:1.6">${p.description}</div></details>` : ''}

      <div style="display:flex;gap:12px">
        <button class="btn-primary" style="flex:1" onclick="prefillProduct('${pid}','${safeName}','${price}','${safeImages}');closeDetailModal()">
          Importer til butikk
        </button>
        <button class="btn-secondary" onclick="closeDetailModal()">Lukk</button>
      </div>
    `;
  } catch (err) {
    document.getElementById('detail-modal-content').innerHTML = `<p style="color:red">Kunne ikke laste produktdetaljer: ${err.message}</p>`;
  }
}

function selectImg(el, url) {
  document.querySelectorAll('.img-gallery img').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('main-img').src = url;
}

function closeDetailModal() {
  document.getElementById('detail-modal').style.display = 'none';
}

function closeModal(e) {
  if (e.target === document.getElementById('detail-modal')) closeDetailModal();
}

// ── IMPORT ────────────────────────────────────────────────────

function prefillProduct(pid, name, price, images) {
  showPage('products', null);
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('[onclick*="products"]').classList.add('active');
  document.getElementById('p-cj-id').value = pid;
  document.getElementById('p-name').value = name;
  document.getElementById('p-buy').value = price;
  document.getElementById('p-sell').value = Math.round((parseFloat(price) || 0) * 10.5 * 1.25);
  if (images) document.getElementById('p-images').value = images;
  document.getElementById('p-cj-id').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>
</body>
</html>
