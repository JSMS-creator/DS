<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Takk for bestillingen!</title>
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    .thankyou { max-width: 560px; margin: 80px auto; padding: 0 24px; text-align: center; }
    .thankyou .icon { font-size: 4rem; margin-bottom: 16px; }
    .thankyou h1 { margin-bottom: 16px; }
    .thankyou p { color: #666; margin-bottom: 24px; }
    .track-form { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
    .track-form input { flex: 1; min-width: 200px; padding: 12px 16px; border: 1.5px solid #e8e8e8; border-radius: 8px; font-size: 0.95rem; }
    .track-form button { padding: 12px 24px; background: #111; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    #track-result { margin-top: 16px; padding: 16px; background: #f5f5f5; border-radius: 8px; font-size: 0.95rem; display: none; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="logo">Store</a>
  </div>
</nav>
<div class="thankyou">
  <div class="icon">🎉</div>
  <h1>Takk for bestillingen!</h1>
  <p>Du mottar en ordrebekreftelse på e-post innen få minutter. Pakken sendes fra vårt europeiske lager og leveres til deg i løpet av 3–7 virkedager.</p>
  <p style="font-size:0.9rem;color:#999">Sporingsinformasjon sendes på e-post så snart pakken er på vei.</p>

  <div class="track-form">
    <input id="pi-input" type="text" placeholder="Lim inn Payment Intent ID fra kvittering" />
    <button onclick="trackOrder()">Spor ordre</button>
  </div>
  <div id="track-result"></div>
</div>
<script>
  // Pre-fill from Stripe redirect
  const params = new URLSearchParams(location.search);
  const pi = params.get('payment_intent');
  if (pi) document.getElementById('pi-input').value = pi;

  async function trackOrder() {
    const id = document.getElementById('pi-input').value.trim();
    if (!id) return;
    const el = document.getElementById('track-result');
    el.style.display = 'block';
    el.textContent = 'Henter sporingsinfo...';
    const res = await fetch(`http://localhost:3001/api/orders/track/${id}`);
    const data = await res.json();
    if (data.error) { el.textContent = 'Fant ikke ordren. Sjekk ID-en og prøv igjen.'; return; }
    el.innerHTML = `<b>Status:</b> ${data.status}<br>${data.tracking ? `<b>Sporingsnummer:</b> ${data.tracking}${data.trackingUrl ? ` — <a href="${data.trackingUrl}" target="_blank">Spor pakken</a>` : ''}` : 'Sporingsnummer er ikke tilgjengelig ennå — sjekk igjen om 24 timer.'}`;
  }
  window.trackOrder = trackOrder;
</script>
</body>
</html>
